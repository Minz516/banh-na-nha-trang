name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Dummy values so apps/api's env.ts (Zod-validated at import time) doesn't fail
  # to boot in CI — no real DB/secrets are used, since apps/api's Jest suite runs
  # against mongodb-memory-server rather than a live MongoDB instance.
  NODE_ENV: test
  MONGODB_URI: mongodb://127.0.0.1:27017/ci-placeholder
  JWT_SECRET: ci-placeholder-jwt-secret-not-for-real-use
  JWT_REFRESH_SECRET: ci-placeholder-jwt-refresh-secret-not-for-real-use

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
